# FlipScout watchlist - routes you drive and searches you run.
#
# Copy to watchlist.yaml and edit. The scanner reads watchlist.yaml.
#
# Coordinates are approximate city centers, which is plenty: they are used
# for "how far off my route is this", where a few hundred metres is noise.

# ---------------------------------------------------------------------------
# WHERE YOU ACTUALLY ARE during the week. A "quick grab" is measured from
# these, not from a route - it is a short round trip squeezed into time you
# already have, not a drive you are already making.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# WORK TERRITORY. As a field technician you move through this constantly
# without planning trips into it, so anything inside costs far less to
# collect than raw mileage suggests.
# ---------------------------------------------------------------------------
service_areas:
  - name: "central-iowa"
    radius_miles: 100
    center: { name: "Des Moines", lat: 41.5868, lon: -93.6250 }
    notes: "Covers Ames, Fort Dodge, Marshalltown, Newton, Carroll, Osceola."

# ---------------------------------------------------------------------------
# COWORKERS who can collect for you. A teammate passing a listing on their
# commute turns a 60-mile round trip into a favour.
#
# favor_cost is what you book against the deal for asking. Favours are finite;
# pricing them at zero is how you burn goodwill on $12 margins.
# Replace these with real people and real locations.
# ---------------------------------------------------------------------------
helpers:
  - name: "coworker-ames"
    lat: 42.0308
    lon: -93.6319
    max_detour_miles: 15
    favor_cost: 15
    notes: "PLACEHOLDER - replace with a real teammate"
  - name: "coworker-fort-dodge"
    lat: 42.4975
    lon: -94.1680
    max_detour_miles: 15
    favor_cost: 15
    notes: "PLACEHOLDER - replace with a real teammate"

bases:
  - { name: "home", postal_code: "50309", lat: 41.5868, lon: -93.6250 }
  # Replace with your actual work location - this drives the whole quick tier.
  - { name: "work", postal_code: "50309", lat: 41.5868, lon: -93.6250 }

# ---------------------------------------------------------------------------
# WHEN you can collect, and how far you will realistically go on a work day.
#
# max_pickup_minutes is ROUND TRIP. 45 minutes at 35 mph averages out to
# roughly 13 miles each way - less in town. Setting this honestly is what
# stops the scanner surfacing things you will never actually go get.
# ---------------------------------------------------------------------------
availability:
  max_pickup_minutes: 45
  average_speed_mph: 35
  windows:
    - { day: "wed", start: "17:30", end: "20:00" }
    - { day: "sat", start: "09:00", end: "13:00" }

routes:
  # ---------------------------------------------------------------------
  # The every-two-weeks Sioux City run, two ways. Keep the one you drive
  # and delete the other, or keep both - a search scoped to no route uses
  # all of them.
  # ---------------------------------------------------------------------

  # Northern option: I-35 up to US-20 west, through Fort Dodge.
  - name: sioux-city-us20
    max_detour_miles: 35
    cadence_days: 14
    notes: "I-35 N to US-20 W. Four-lane most of the way, easiest with a truck."
    waypoints:
      - { name: "Des Moines",  postal_code: "50309", lat: 41.5868, lon: -93.6250 }
      - { name: "Ames",        postal_code: "50010", lat: 42.0308, lon: -93.6319 }
      - { name: "Webster City",postal_code: "50595", lat: 42.4691, lon: -93.8155 }
      - { name: "Fort Dodge",  postal_code: "50501", lat: 42.4975, lon: -94.1680 }
      - { name: "Sac City",    postal_code: "50583", lat: 42.4222, lon: -94.9902 }
      - { name: "Storm Lake",  postal_code: "50588", lat: 42.6414, lon: -95.2097 }
      - { name: "Sioux City",  postal_code: "51101", lat: 42.4963, lon: -96.4049 }

  # Diagonal option: IA-141 / US-30 through Carroll and Denison.
  - name: sioux-city-us30
    max_detour_miles: 35
    cadence_days: 14
    notes: "IA-141 NW to US-30 W. Shorter on the map, more small towns."
    waypoints:
      - { name: "Des Moines", postal_code: "50309", lat: 41.5868, lon: -93.6250 }
      - { name: "Perry",      postal_code: "50220", lat: 41.8400, lon: -94.1069 }
      - { name: "Jefferson",  postal_code: "50129", lat: 42.0153, lon: -94.3775 }
      - { name: "Carroll",    postal_code: "51401", lat: 42.0653, lon: -94.8669 }
      - { name: "Denison",    postal_code: "51442", lat: 42.0189, lon: -95.3553 }
      - { name: "Mapleton",   postal_code: "51034", lat: 42.1655, lon: -95.7936 }
      - { name: "Sioux City", postal_code: "51101", lat: 42.4963, lon: -96.4049 }

  # ---------------------------------------------------------------------
  # Statewide net. Not a drive you make - a coarse filter for anything in
  # Iowa worth a special trip. Give it a tighter min_multiple in searches.
  # ---------------------------------------------------------------------
  - name: iowa-statewide
    max_detour_miles: 45
    notes: "All Iowa metros. Use for high-value finds worth a dedicated run."
    waypoints:
      - { name: "Sioux City",     postal_code: "51101", lat: 42.4963, lon: -96.4049 }
      - { name: "Council Bluffs", postal_code: "51501", lat: 41.2619, lon: -95.8608 }
      - { name: "Des Moines",     postal_code: "50309", lat: 41.5868, lon: -93.6250 }
      - { name: "Mason City",     postal_code: "50401", lat: 43.1536, lon: -93.2010 }
      - { name: "Waterloo",       postal_code: "50701", lat: 42.4928, lon: -92.3426 }
      - { name: "Cedar Rapids",   postal_code: "52401", lat: 41.9779, lon: -91.6656 }
      - { name: "Iowa City",      postal_code: "52240", lat: 41.6611, lon: -91.5302 }
      - { name: "Davenport",      postal_code: "52801", lat: 41.5236, lon: -90.5776 }
      - { name: "Dubuque",        postal_code: "52001", lat: 42.5006, lon: -90.6646 }

  # ---------------------------------------------------------------------
  # Sioux City sits in a tri-state corner. Once you are already there,
  # Sioux Falls and Omaha are day-trip close and are far bigger markets
  # than anything between them.
  # ---------------------------------------------------------------------
  - name: sioux-city-metros
    max_detour_miles: 30
    notes: "Reachable once parked in Sioux City. Sioux Falls ~90min N, Omaha ~90min S."
    waypoints:
      - { name: "Sioux Falls SD", postal_code: "57104", lat: 43.5460, lon: -96.7313 }
      - { name: "Le Mars",        postal_code: "51031", lat: 42.7941, lon: -96.1653 }
      - { name: "Sioux City",     postal_code: "51101", lat: 42.4963, lon: -96.4049 }
      - { name: "Onawa",          postal_code: "51040", lat: 42.0266, lon: -96.0969 }
      - { name: "Council Bluffs", postal_code: "51501", lat: 41.2619, lon: -95.8608 }
      - { name: "Omaha NE",       postal_code: "68102", lat: 41.2565, lon: -95.9345 }

# NOTE ON assumed_resale_price
# --------------------------------------------------------------------------
# These are PLACEHOLDERS you must replace with your own numbers. They are not
# researched values and they are not sold comps. The scanner does arithmetic
# on whatever you put here - garbage in, confident-looking garbage out.
#
# Until you have Marketplace Insights access, set each one from Terapeak
# SOLD/COMPLETED listings (not active listings), then haircut it ~15% for
# condition risk. Re-check `flipscout stats` after ~20 real sales and adjust.

# NOTE ON assumed_resale_price
# --------------------------------------------------------------------------
# These are PLACEHOLDERS. Replace every one with your own research. They are
# not sold comps. The scanner does arithmetic on whatever you put here -
# garbage in, confident-looking garbage out.
#
# Until Marketplace Insights access lands, set each from Terapeak SOLD /
# COMPLETED listings (not active ones), then haircut ~15% for condition risk.
# Re-check `flipscout stats` after ~20 real sales and adjust.

searches:
  # =====================================================================
  # TIER 1 - THE CORE MODEL: general flipping, sourced opportunistically.
  # This is the business. Everything below it is a bonus.
  # =====================================================================

  - name: power-tools
    q: "dewalt milwaukee makita tool lot"
    assumed_resale_price: 250        # PLACEHOLDER
    max_price: 70
    min_multiple: 3
    bulk: small
    notes: "Highest turnover category. Always sells, always local demand."

  - name: vintage-audio
    q: "vintage receiver marantz pioneer sansui"
    assumed_resale_price: 450        # PLACEHOLDER
    max_price: 90
    min_multiple: 4
    bulk: medium

  - name: pyrex-glassware
    q: "vintage pyrex"
    condition: USED_GOOD
    assumed_resale_price: 120        # PLACEHOLDER
    max_price: 25
    min_multiple: 5
    bulk: small

  - name: small-appliances
    q: "kitchenaid stand mixer"
    assumed_resale_price: 220        # PLACEHOLDER
    max_price: 55
    min_multiple: 4
    bulk: small

  # =====================================================================
  # TIER 2 - THE TRUCK EDGE: local-pickup-only, priced for a tiny buyer
  # pool because it cannot ship. Run these on the Sioux City corridor.
  # =====================================================================

  - name: cabinet-saws
    q: "table saw cabinet saw"
    assumed_resale_price: 700        # PLACEHOLDER
    local_pickup_only: true
    max_price: 200
    min_multiple: 3
    bulk: large
    routes: [sioux-city-us20, sioux-city-us30]

  - name: commercial-kitchen
    q: "commercial restaurant equipment"
    assumed_resale_price: 1200       # PLACEHOLDER
    local_pickup_only: true
    max_price: 350
    min_multiple: 4
    bulk: large
    routes: [sioux-city-us20, sioux-city-us30]
    notes: "Small-town restaurant closures. Rarely shipped, often near-free."

  - name: exercise-equipment
    q: "power rack squat rack"
    assumed_resale_price: 600        # PLACEHOLDER
    local_pickup_only: true
    max_price: 150
    min_multiple: 3
    bulk: large
    routes: [sioux-city-us20, sioux-city-us30]
    notes: "January buys. Nobody wants to move these, which is the point."

  # =====================================================================
  # TIER 3 - THE REPAIR EDGE: dead ELECTRONICS.
  #
  # Your real advantage is diagnosing power supplies, boards, connectors,
  # and battery packs - not any one product category. "For parts / not
  # working" is near-worthless to a general buyer and ordinary-valuable
  # to someone who can test it. None of this touches your day job.
  #
  # repair_success_rate MULTIPLIES resale, so an optimistic number inflates
  # the whole category at once. Start low; raise only when stats prove it.
  # =====================================================================

  - name: dead-power-tools
    q: "power tool not working parts repair"
    condition: FOR_PARTS_OR_NOT_WORKING
    assumed_resale_price: 180        # PLACEHOLDER
    repairable: true
    estimated_repair_cost: 25        # usually a switch, brushes, or a pack
    repair_success_rate: 0.7
    max_price: 35
    min_multiple: 3
    bulk: small

  - name: dead-audio
    q: "vintage receiver amplifier not working parts"
    condition: FOR_PARTS_OR_NOT_WORKING
    assumed_resale_price: 400        # PLACEHOLDER
    repairable: true
    estimated_repair_cost: 45        # caps, lamps, a bad channel
    repair_success_rate: 0.6
    max_price: 60
    min_multiple: 4
    bulk: medium

  - name: test-equipment
    q: "oscilloscope multimeter bench power supply"
    assumed_resale_price: 350        # PLACEHOLDER
    repairable: true
    estimated_repair_cost: 40
    repair_success_rate: 0.7
    max_price: 70
    min_multiple: 3
    bulk: small
    notes: "Your bench skills read this category better than most bidders."

  - name: battery-devices
    q: "cordless tool battery charger lot not working"
    condition: FOR_PARTS_OR_NOT_WORKING
    assumed_resale_price: 150        # PLACEHOLDER
    repairable: true
    estimated_repair_cost: 30        # cells
    repair_success_rate: 0.6
    max_price: 25
    min_multiple: 3
    bulk: small

  # =====================================================================
  # TIER 4 - BONUS ONLY: consumer/home medical found incidentally.
  #
  # NOT a sourcing strategy. These are estate-sale and garage-sale finds
  # that happen to be medical, with no connection to your employer.
  #
  # Institutional gear - infusion pumps, patient monitors, anything you
  # would service on the clock - is deliberately ABSENT. Even with no
  # written conflict policy, sourcing your employer's category is a line
  # not worth walking for a flip. Keep it that way.
  #
  # Verify prescription status and marketplace policy before listing.
  # =====================================================================

  - name: home-tens-units
    q: "TENS EMS unit"
    enabled: false                   # turn on when you want the bonus lane
    assumed_resale_price: 180        # PLACEHOLDER
    repairable: true
    estimated_repair_cost: 25
    repair_success_rate: 0.7
    max_price: 30
    min_multiple: 4
    bulk: small
    notes: "Consumer OTC units only. Usually a dead battery or a bad lead."

  - name: mobility-equipment
    q: "power wheelchair mobility scooter"
    enabled: false
    assumed_resale_price: 900        # PLACEHOLDER
    local_pickup_only: true
    repairable: true
    estimated_repair_cost: 200       # batteries are most of this
    repair_success_rate: 0.75
    max_price: 250
    min_multiple: 3
    bulk: large
    notes: "Almost always dead batteries. Heavy - the truck matters here."
